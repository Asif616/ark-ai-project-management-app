# Compose defaults the project name to the directory name (bam-*). Pin it.
name: ark

services:
  server:
    build: ./server
    env_file: .env

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: /api
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?set VITE_SUPABASE_URL in .env}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?set VITE_SUPABASE_PUBLISHABLE_KEY in .env}
    ports:
      - "8080:80"
    # nginx resolves the upstream host at config-parse time and refuses to boot
    # if it cannot. This guarantees the `server` container exists in DNS first.
    depends_on:
      - server