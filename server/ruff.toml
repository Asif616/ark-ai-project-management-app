# Minimal lint: pyflakes (F) + pycodestyle errors (E4/E7/E9).
# Deliberately NOT enabling UP/B/SIM modernizations yet — the existing
# codebase uses Optional[]/Depends() defaults throughout and rewriting all
# of that is a separate, noisy diff. Adopt rule-by-rule when wanted.
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F"]
